spring:
  application:
    name: ecommerce-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jpa:
  hibernate:
    ddl-auto: none
  open-in-view: false
  properties:
    hibernate.format_sql: true

app:
  jwt:
    expiration-minutes: 120
    # Lecția 11 - access tokenul rămâne scurt (de sus); refresh tokenul,
    # ținut în baza de date (nu într-un JWT), trăiește mult mai mult.
    refresh-days: 30
  discount:
    category-name: Accesorii
    percentage: 15

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    md.impact.ecommerce: INFO

# Lecția 11 - OAuth2 / login social (awareness, nu implementare completă).
